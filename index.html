<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Lanche – Menu Digital</title>
<style>
:root{--bg:#2a0c05;--card:#fdf1dc;--ink:#2a0c05;--gold:#ffc41f;--gold2:#f59e0b;--mut:#8a6a55;--wa:#25d366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0c05}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 110px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:560px;margin:0 auto}
header img{width:40px;height:40px;border-radius:50%}
header b{flex:1;font-size:18px;color:var(--gold)}
.cartbtn{background:var(--gold);color:var(--ink);border-radius:20px;padding:8px 14px;font-weight:700}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;max-width:560px;margin:0 auto}
nav button{flex:none;background:#4a1d10;color:#fff;border-radius:18px;padding:8px 16px}
nav button.on{background:var(--gold);color:var(--ink);font-weight:700}
.cover{text-align:center;padding:30px 10px}
.cover img{width:170px;height:170px;border-radius:50%;box-shadow:0 0 0 4px var(--gold)}
.cover h1{font-size:40px;margin:18px 0 4px;color:var(--gold);line-height:1}
.cover p{margin:0 0 22px;font-style:italic;opacity:.9}
.big{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:16px;margin:10px 0;text-align:center;text-decoration:none}
.pri{background:var(--gold);color:var(--ink)}.wa{background:var(--wa);color:#073b1a}
.soc{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.soc a{background:#4a1d10;color:#fff;border-radius:18px;padding:8px 14px;text-decoration:none;font-size:14px}
h2{color:var(--gold);margin:6px 0 12px}
.item{display:flex;gap:12px;background:var(--card);color:var(--ink);border-radius:16px;padding:10px;margin-bottom:10px;align-items:center}
.item img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none}
.item .i{flex:1;min-width:0}.item .n{font-weight:700;line-height:1.2}.item small{color:var(--mut);display:block;font-size:12px}
.pr{font-weight:800;color:#b45309;margin:4px 0}
.act{display:flex;gap:6px}
.act button{border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700}
.add{background:var(--ink);color:var(--gold)}.ped{background:var(--wa);color:#073b1a}.act a{border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;text-decoration:none;display:inline-block}
.sheet{position:fixed;inset:auto 0 0 0;max-width:560px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto;z-index:20;display:none;box-shadow:0 -10px 40px #0008}
.sheet.show{display:block}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #0001}
.row span:first-child{flex:1}.q button{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--gold)}
.q{display:flex;gap:8px;align-items:center}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:12px 0}
input{width:100%;padding:11px;border-radius:10px;border:1px solid #0003;font:inherit;margin-bottom:8px}
.bar{background:#0001;border-radius:6px;height:10px;margin-top:3px}.bar i{display:block;height:100%;background:var(--gold2);border-radius:6px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kp div{background:#fff;border-radius:12px;padding:10px}.kp b{display:block;font-size:20px}
.fab{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;padding:0 14px;z-index:6}
.close{float:right;background:none;font-size:22px}
.pms{display:flex;gap:6px;margin:8px 0}.pms button{flex:1;padding:10px;border-radius:10px;background:#0001;color:var(--ink);font-weight:700}.pms button.on{background:var(--ink);color:var(--gold)}.pbox{background:#fff;border-radius:12px;padding:10px;font-size:14px;margin-bottom:10px;line-height:1.6;word-break:break-word}.pbox button{margin-top:6px;border-radius:8px;padding:6px 10px;background:var(--ink);color:var(--gold);font-weight:700}
.foot{text-align:center;opacity:.7;font-size:13px;margin-top:20px}.foot a{color:var(--gold)}
</style></head><body>
<header><img id="lg" alt=""><b>Super Lanche</b><button class="cartbtn" onclick="openCart()">🛒 <span id="cc">0</span></button></header>
<nav id="nav"></nav>
<div class="wrap" id="main"></div>
<div class="fab" id="fab"></div>
<div class="sheet" id="cart"></div>
<div class="sheet" id="adm"></div>
